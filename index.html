<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahjong Deluxe</title>
<style>
:root {
    --bg-color: #064e3b;
    --tile-ivory: #fffef0;
    --tile-side: #d1d5db;
    --tile-back: #059669;
}

body {
    margin: 0;
    background: radial-gradient(circle, #065f46 0%, #022c22 100%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
}

header {
    padding: 20px;
    text-align: center;
}

.controls {
    margin-bottom: 20px;
}

button {
    padding: 10px 20px;
    font-size: 1rem;
    cursor: pointer;
    background: #10b981;
    border: none;
    color: white;
    border-radius: 8px;
    font-weight: bold;
    box-shadow: 0 4px 0 #047857;
}

button:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #047857;
}

.board-container {
    position: relative;
    width: 1000px;
    height: 700px;
    perspective: 1200px;
}

.tile {
    position: absolute;
    width: 64px;
    height: 84px;
    background: linear-gradient(135deg, #ffffff 0%, #f3f4f6 100%);
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    
    /* Complex Shadow for realistic 3D depth */
    box-shadow: 
        -1px 1px 0 var(--tile-side),
        -2px 2px 0 var(--tile-side),
        -3px 3px 0 var(--tile-back),
        -4px 4px 0 var(--tile-back),
        -6px 6px 12px rgba(0,0,0,0.4);
}

/* Tile Internal "Carved" Look */
.tile::after {
    content: '';
    position: absolute;
    inset: 4px;
    border: 1px solid rgba(0,0,0,0.05);
    border-radius: 3px;
    pointer-events: none;
}

.tile.selected {
    transform: translate(0, -10px);
    background: #fef08a; /* Yellow highlight */
    box-shadow: 0 0 15px #facc15;
}

.tile.hint {
    animation: pulse 1s infinite alternate;
}

@keyframes pulse {
    from { box-shadow: 0 0 5px #fff; }
    to { box-shadow: 0 0 25px #60a5fa; outline: 3px solid #60a5fa; }
}

.tile.blocked {
    filter: brightness(0.7) grayscale(0.2);
}

.tile.hidden { display: none; }

.tile svg { width: 80%; height: 80%; }

#msg {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.9);
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    display: none;
    z-index: 1000;
}
</style>
</head>
<body>

<header>
    <h1>Mahjong Solitaire</h1>
    <p>Tiles Left: <span id="count">144</span></p>
    <div class="controls">
        <button onclick="getHint()">Need a Hint?</button>
        <button onclick="location.reload()" style="background:#ef4444; box-shadow: 0 4px 0 #b91c1c;">New Game</button>
    </div>
</header>

<div class="board-container" id="board"></div>

<div id="msg">
    <h2 id="msg-text">No More Moves!</h2>
    <button onclick="location.reload()">Restart</button>
</div>

<script>
const board = document.getElementById('board');
const msg = document.getElementById('msg');
let tiles = [];
let selected = null;

// Layout Definition (The "Turtle" formation)
function createTurtleLayout() {
    const layout = [];
    // Bottom layer
    for(let r=0; r<8; r++) {
        for(let c=0; c<12; c++) {
            if ((r>0 && r<7) || (c>0 && c<11)) layout.push({r, c, z:0});
        }
    }
    // Mid layers
    for(let r=1; r<7; r++) for(let c=2; c<10; c++) layout.push({r, c, z:1});
    for(let r=2; r<6; r++) for(let c=4; r<8; c++) layout.push({r, c, z:2});
    // Peak
    layout.push({r:3.5, c:5.5, z:3});
    return layout.slice(0, 144);
}

function getTileSVG(val) {
    const [type, num] = val.split('-');
    const colors = { dots: '#2563eb', bamboo: '#059669', char: '#dc2626', wind: '#1f2937' };
    const charMap = { 'char': '萬', 'E': '東', 'S': '南', 'W': '西', 'N': '北', 'R': '中', 'G': '發' };
    
    let content = '';
    if(type === 'dots') content = `<circle cx="50" cy="50" r="30" fill="${colors.dots}"/><text x="50" y="62" text-anchor="middle" fill="white" font-weight="bold" font-size="30">${num}</text>`;
    else if(type === 'bamboo') content = `<rect x="40" y="20" width="20" height="60" rx="5" fill="${colors.bamboo}"/><text x="50" y="55" text-anchor="middle" fill="white" font-size="20">${num}</text>`;
    else content = `<text x="50" y="65" text-anchor="middle" font-size="50" fill="${colors[type] || '#333'}">${charMap[num] || charMap[type] || num}</text>`;
    
    return `<svg viewBox="0 0 100 100">${content}</svg>`;
}

function init() {
    const layout = createTurtleLayout();
    const values = [];
    ['dots','bamboo','char'].forEach(t => { for(let i=1;i<=9;i++) for(let j=0;j<4;j++) values.push(`${t}-${i}`); });
    ['E','S','W','N','R','G'].forEach(v => { for(let j=0;j<4;j++) values.push(`wind-${v}`); });
    while(values.length < 144) values.push('char-9');
    values.sort(() => Math.random() - 0.5);

    layout.forEach((p, i) => {
        const t = document.createElement('div');
        t.className = 'tile';
        t.dataset.v = values[i];
        t.dataset.r = p.r; t.dataset.c = p.c; t.dataset.z = p.z;
        t.style.left = `${p.c * 66 - (p.z * 4)}px`;
        t.style.top = `${p.r * 86 - (p.z * 4)}px`;
        t.style.zIndex = p.z;
        t.innerHTML = getTileSVG(values[i]);
        t.onclick = () => handleTileClick(t);
        board.appendChild(t);
        tiles.push(t);
    });
    updateBoardState();
}

function isTileBlocked(t) {
    const r = parseFloat(t.dataset.r);
    const c = parseFloat(t.dataset.c);
    const z = parseInt(t.dataset.z);
    
    const active = tiles.filter(x => !x.classList.contains('hidden') && x !== t);
    
    const onTop = active.some(x => parseInt(x.dataset.z) > z && Math.abs(parseFloat(x.dataset.r)-r) < 1 && Math.abs(parseFloat(x.dataset.c)-c) < 1);
    if(onTop) return true;

    const left = active.some(x => parseInt(x.dataset.z) === z && Math.abs(parseFloat(x.dataset.r)-r) < 1 && parseFloat(x.dataset.c) === c-1);
    const right = active.some(x => parseInt(x.dataset.z) === z && Math.abs(parseFloat(x.dataset.r)-r) < 1 && parseFloat(x.dataset.c) === c+1);
    return left && right;
}

function updateBoardState() {
    let freeTiles = [];
    tiles.forEach(t => {
        if(t.classList.contains('hidden')) return;
        const blocked = isTileBlocked(t);
        t.classList.toggle('blocked', blocked);
        if(!blocked) freeTiles.push(t);
    });

    document.getElementById('count').textContent = tiles.filter(t => !t.classList.contains('hidden')).length;

    // Check for No More Moves
    const possibleMoves = freeTiles.some(t1 => freeTiles.some(t2 => t1 !== t2 && t1.dataset.v === t2.dataset.v));
    if(!possibleMoves && tiles.filter(t => !t.classList.contains('hidden')).length > 0) {
        msg.style.display = 'block';
    }
}

function getHint() {
    tiles.forEach(t => t.classList.remove('hint'));
    const free = tiles.filter(t => !t.classList.contains('hidden') && !t.classList.contains('blocked'));
    for(let t1 of free) {
        for(let t2 of free) {
            if(t1 !== t2 && t1.dataset.v === t2.dataset.v) {
                t1.classList.add('hint');
                t2.classList.add('hint');
                return;
            }
        }
    }
}

function handleTileClick(t) {
    if(t.classList.contains('blocked')) return;
    tiles.forEach(tile => tile.classList.remove('hint'));

    if(!selected) {
        selected = t;
        t.classList.add('selected');
    } else if(selected === t) {
        selected.classList.remove('selected');
        selected = null;
    } else if(selected.dataset.v === t.dataset.v) {
        t.classList.add('hidden');
        selected.classList.add('hidden');
        selected = null;
        updateBoardState();
    } else {
        selected.classList.remove('selected');
        selected = t;
        t.classList.add('selected');
    }
}

init();
</script>
</body>
</html>
