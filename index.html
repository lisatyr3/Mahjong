<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pro Mahjong Solitaire</title>

<style>
:root {
  --tile-bg: #fcfaf0;
  --tile-edge: #e2dfd2;
  --tile-back: #2d6a4f; /* Classic Green Back */
  --accent: #2a9d8f;
}

body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: radial-gradient(circle, #1a4731 0%, #0d2117 100%);
  color: white;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

header {
  text-align: center;
  padding: 20px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}

/* Container that scales the board to fit the screen */
.board-wrap {
  width: 95vw;
  height: 80vh;
  position: relative;
  overflow: auto;
  padding: 50px;
  display: flex;
  justify-content: center;
}

.board {
  position: relative;
  /* Width/Height controlled by layout */
  width: 1000px;
  height: 600px;
  transform: perspective(1000px);
}

.tile {
  position: absolute;
  width: 60px;
  height: 80px;
  background: var(--tile-bg);
  border-radius: 4px;
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: center;
  
  /* The 3D "Chunk" Effect */
  box-shadow: 
    -1px 1px 0 var(--tile-edge),
    -2px 2px 0 var(--tile-edge),
    -3px 3px 0 var(--tile-back),
    -4px 4px 0 var(--tile-back),
    -5px 5px 0 var(--tile-back),
    -8px 10px 15px rgba(0,0,0,0.4);
    
  transition: all 0.1s ease;
}

/* Hover and Selection */
.tile:not(.blocked):hover {
  filter: brightness(1.1);
  transform: translate(2px, -2px);
}

.tile.selected {
  outline: 3px solid #ffeb3b;
  box-shadow: 0 0 20px #ffeb3b;
  z-index: 100 !important;
}

.tile.blocked {
  filter: grayscale(0.5) brightness(0.7);
  cursor: not-allowed;
}

.tile.hidden {
  display: none;
}

/* SVG Styling */
.tile svg {
  width: 75%;
  height: 75%;
  filter: drop-shadow(0.5px 0.5px 0px rgba(0,0,0,0.2));
}

.stats {
  background: rgba(0,0,0,0.3);
  padding: 10px 20px;
  border-radius: 30px;
  font-size: 1.1rem;
  border: 1px solid rgba(255,255,255,0.1);
}
</style>
</head>

<body>

<header>
  <h1>Mahjong Solitaire</h1>
  <div class="stats">
    Tiles: <span id="tilesLeft">144</span> | Moves: <span id="moves">0</span>
  </div>
</header>

<div class="board-wrap">
  <div class="board" id="board"></div>
</div>

<script>
const board = document.getElementById("board");
const tilesLeftEl = document.getElementById("tilesLeft");
const movesEl = document.getElementById("moves");

let tiles = [];
let selected = null;
let moves = 0;

// Constants for layout
const T_WIDTH = 62;
const T_HEIGHT = 82;

/* Build a "Turtle" style layout (simplified) */
function createLayout() {
  const l = [];
  // Layer 0 (Bottom)
  for (let r=0; r<8; r++) {
    for (let c=0; c<12; c++) {
      if ((r > 0 && r < 7) || (c > 0 && c < 11)) l.push({r, c, z:0});
    }
  }
  // Layer 1
  for (let r=1; r<7; r++) for (let c=2; c<10; c++) l.push({r, c, z:1});
  // Layer 2
  for (let r=2; r<6; r++) for (let c=4; c<8; c++) l.push({r, c, z:2});
  // Layer 3 (Top)
  l.push({r:3.5, c:5.5, z:3}, {r:3.5, c:6.5, z:3});
  
  return l.slice(0, 144); // Keep it to 144
}

function buildValues() {
  const v=[];
  const types = ['dots', 'bamboo', 'char'];
  types.forEach(t => {
    for(let i=1; i<=9; i++) for(let j=0; j<4; j++) v.push(`${t}-${i}`);
  });
  ["E","S","W","N"].forEach(w => {for(let i=0; i<4; i++) v.push(`wind-${w}`)});
  ["R","G","B"].forEach(d => {for(let i=0; i<4; i++) v.push(`dragon-${d}`)});
  
  while(v.length < 144) v.push("dragon-G"); 
  return v.sort(() => Math.random() - 0.5);
}

function tileSVG(type) {
  const val = type.split("-")[1];
  if(type.startsWith("dots")) {
    return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="35" fill="none" stroke="#2563eb" stroke-width="8"/><text x="50" y="65" text-anchor="middle" font-size="40" fill="#2563eb" font-weight="bold">${val}</text></svg>`;
  }
  if(type.startsWith("bamboo")) {
    return `<svg viewBox="0 0 100 100"><rect x="40" y="20" width="20" height="60" rx="5" fill="#15803d"/><text x="50" y="60" text-anchor="middle" font-size="30" fill="white">${val}</text></svg>`;
  }
  if(type.startsWith("char")) {
    return `<svg viewBox="0 0 100 100"><text x="50" y="50" text-anchor="middle" font-size="40" fill="#b91c1c" font-weight="bold">萬</text><text x="50" y="85" text-anchor="middle" font-size="25" fill="#333">${val}</text></svg>`;
  }
  const color = type.includes("-R") ? "#d00" : type.includes("-G") ? "#080" : "#00d";
  return `<svg viewBox="0 0 100 100"><text x="50" y="70" text-anchor="middle" font-size="60" fill="${color}">${val}</text></svg>`;
}

function newGame() {
  board.innerHTML = "";
  tiles = [];
  const layout = createLayout();
  const values = buildValues();

  layout.forEach((p, i) => {
    const t = document.createElement("div");
    t.className = "tile";
    t.dataset.value = values[i];
    t.dataset.r = p.r;
    t.dataset.c = p.c;
    t.dataset.z = p.z;
    
    // Offset each layer slightly to create the 3D stack look
    const x = p.c * (T_WIDTH - 10) - (p.z * 4);
    const y = p.r * (T_HEIGHT - 15) - (p.z * 4);
    
    t.style.left = `${x}px`;
    t.style.top = `${y}px`;
    t.style.zIndex = p.z;
    
    t.innerHTML = tileSVG(values[i]);
    t.onclick = () => clickTile(t);
    board.appendChild(t);
    tiles.push(t);
  });

  updateFree();
}

function isBlocked(tile) {
  const z = +tile.dataset.z;
  const r = parseFloat(tile.dataset.r);
  const c = parseFloat(tile.dataset.c);

  const activeTiles = tiles.filter(t => !t.classList.contains("hidden"));

  // Check if anything is on top (higher Z)
  const onTop = activeTiles.some(t => 
    +t.dataset.z > z && 
    Math.abs(parseFloat(t.dataset.r) - r) < 1 && 
    Math.abs(parseFloat(t.dataset.c) - c) < 1
  );
  if (onTop) return true;

  // Check left and right
  const blockedLeft = activeTiles.some(t => 
    +t.dataset.z === z && 
    Math.abs(parseFloat(t.dataset.r) - r) < 1 && 
    parseFloat(t.dataset.c) === c - 1
  );
  const blockedRight = activeTiles.some(t => 
    +t.dataset.z === z && 
    Math.abs(parseFloat(t.dataset.r) - r) < 1 && 
    parseFloat(t.dataset.c) === c + 1
  );

  return blockedLeft && blockedRight;
}

function updateFree() {
  tiles.forEach(t => {
    if (!t.classList.contains("hidden")) {
      const blocked = isBlocked(t);
      t.classList.toggle("blocked", blocked);
    }
  });
}

function clickTile(tile) {
  if (tile.classList.contains("blocked")) return;

  if (!selected) {
    selected = tile;
    tile.classList.add("selected");
  } else if (selected === tile) {
    tile.classList.remove("selected");
    selected = null;
  } else if (selected.dataset.value === tile.dataset.value) {
    selected.classList.add("hidden");
    tile.classList.add("hidden");
    selected = null;
    moves++;
    updateFree();
    updateStats();
  } else {
    selected.classList.remove("selected");
    selected = tile;
    tile.classList.add("selected");
  }
}

function updateStats() {
  tilesLeftEl.textContent = tiles.filter(t => !t.classList.contains("hidden")).length;
  movesEl.textContent = moves;
}

newGame();
</script>
</body>
</html>
