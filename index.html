<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy-Read Mahjong</title>
    <style>
        :root {
            --tile-bg: #ffffff;
            --tile-side: #999;
            --tile-back: #047857;
            --bg-table: #064e3b;
        }

        body {
            margin: 0;
            background-color: var(--bg-table);
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 10px;
            text-align: center;
            background: rgba(0,0,0,0.2);
            width: 100%;
        }

        .controls button {
            padding: 12px 24px;
            font-size: 1.2rem; /* Larger buttons */
            cursor: pointer;
            border: 2px solid white;
            border-radius: 10px;
            font-weight: bold;
            margin: 5px;
        }

        .btn-hint { background: #059669; color: white; }
        .btn-new { background: #dc2626; color: white; }
        .btn-help { background: #2563eb; color: white; }

        .viewport {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .board-container {
            position: relative;
            width: 950px;
            height: 750px;
            transform-origin: center center;
        }

        .tile {
            position: absolute;
            width: 65px;
            height: 85px;
            background: var(--tile-bg);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Extra thick 3D effect for better visibility */
            box-shadow: 
                -2px 2px 0 var(--tile-side),
                -4px 4px 0 var(--tile-back),
                -6px 6px 10px rgba(0,0,0,0.5);
            border: 1px solid #000;
        }

        .tile.selected {
            background: #ffff00; /* Bright Yellow */
            transform: scale(1.1);
            z-index: 1000 !important;
            border: 3px solid #000;
        }

        .tile.blocked {
            filter: brightness(0.4); /* Much darker when blocked */
        }

        .tile.hidden { display: none; }

        /* Very clear pulse for hints */
        .tile.hint {
            outline: 5px solid #3b82f6;
            animation: blink 0.5s step-end infinite;
        }
        @keyframes blink { 50% { outline-color: transparent; } }

        /* Large, thick text for tiles */
        .tile-text {
            font-size: 42px;
            font-weight: 900;
            user-select: none;
        }
        .color-dots { color: #1e40af; }   /* Blue */
        .color-bamboo { color: #166534; } /* Green */
        .color-char { color: #991b1b; }   /* Red */
        .color-special { color: #111827; } /* Black */

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .help-content {
            background: white;
            color: black;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            font-size: 1.3rem;
        }
    </style>
</head>
<body>

<header>
    <div class="controls">
        <button class="btn-help" onclick="toggleHelp(true)">HOW TO PLAY</button>
        <button class="btn-hint" onclick="getHint()">GIVE ME A HINT</button>
        <button class="btn-new" onclick="location.reload()">RESTART GAME</button>
    </div>
    <div style="font-size: 1.2rem; margin-top: 5px;">Tiles Left: <b id="count">144</b></div>
</header>

<div class="viewport" id="viewport">
    <div class="board-container" id="board"></div>
</div>

<div id="msg-overlay" class="overlay">
    <h2 id="msg-text" style="font-size: 4rem;">Game Over</h2>
    <button class="btn-new" onclick="location.reload()">PLAY AGAIN</button>
</div>

<div id="help-overlay" class="overlay" onclick="toggleHelp(false)">
    <div class="help-content" onclick="event.stopPropagation()">
        <h2>Rules</h2>
        <p>1. Find two tiles with the <b>same number and color</b>.</p>
        <p>2. You can only pick a tile if it has <b>no tiles on top</b> and an <b>open left or right side</b>.</p>
        <p>3. Dark tiles are locked. Light tiles are ready to match!</p>
        <button class="btn-help" style="width:100%" onclick="toggleHelp(false)">START PLAYING</button>
    </div>
</div>

<script>
    const board = document.getElementById('board');
    const viewport = document.getElementById('viewport');
    let tiles = [];
    let selected = null;

    function resize() {
        const boardW = 1000;
        const boardH = 800;
        const scale = Math.min(viewport.clientWidth / boardW, viewport.clientHeight / boardH) * 0.95;
        board.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', resize);

    function toggleHelp(show) { document.getElementById('help-overlay').style.display = show ? 'flex' : 'none'; }

    function init() {
        board.innerHTML = "";
        const layout = [];
        // Standard Turtle Layout
        for(let r=0; r<8; r++) for(let c=0; c<12; c++) if ((r>0 && r<7) || (c>0 && c<11)) layout.push({r, c, z:0});
        for(let r=1; r<7; r++) for(let c=2; c<10; c++) layout.push({r, c, z:1});
        for(let r=2; r<6; r++) for(let c=4; c<8; c++) layout.push({r, c, z:2});
        layout.push({r:3.5, c:5.5, z:3}, {r:3.5, c:6.5, z:3});
        
        const deck = [];
        const suits = [
            { name: 'dots', color: 'color-dots' },
            { name: 'bamboo', color: 'color-bamboo' },
            { name: 'char', color: 'color-char' }
        ];

        suits.forEach(s => {
            for(let i=1; i<=9; i++) for(let j=0; j<4; j++) deck.push({val: i, class: s.color});
        });
        // Winds/Dragons simplified to letters
        ['N','E','S','W','C','F'].forEach(v => {
            for(let j=0; j<4; j++) deck.push({val: v, class: 'color-special'});
        });
        while(deck.length < 144) deck.push({val: 'X', class: 'color-special'});
        
        deck.sort(() => Math.random() - 0.5);

        layout.slice(0, 144).forEach((p, i) => {
            const t = document.createElement('div');
            t.className = 'tile';
            t.dataset.v = deck[i].val + deck[i].class;
            t.style.left = `${(p.c * 70) - (p.z * 6) + 50}px`;
            t.style.top = `${(p.r * 90) - (p.z * 6) + 30}px`;
            t.style.zIndex = p.z;
            t.dataset.r = p.r; t.dataset.c = p.c; t.dataset.z = p.z;
            
            t.innerHTML = `<span class="tile-text ${deck[i].class}">${deck[i].val}</span>`;
            t.onclick = () => handleTileClick(t);
            board.appendChild(t);
            tiles.push(t);
        });
        resize();
        updateBoardState();
    }

    function isBlocked(t) {
        const r = parseFloat(t.dataset.r), c = parseFloat(t.dataset.c), z = parseInt(t.dataset.z);
        const active = tiles.filter(x => !x.classList.contains('hidden') && x !== t);
        const onTop = active.some(x => parseInt(x.dataset.z) > z && Math.abs(parseFloat(x.dataset.r)-r) < 1 && Math.abs(parseFloat(x.dataset.c)-c) < 1);
        if(onTop) return true;
        const bLeft = active.some(x => parseInt(x.dataset.z) === z && Math.abs(parseFloat(x.dataset.r)-r) < 1 && parseFloat(x.dataset.c) === c-1);
        const bRight = active.some(x => parseInt(x.dataset.z) === z && Math.abs(parseFloat(x.dataset.r)-r) < 1 && parseFloat(x.dataset.c) === c+1);
        return bLeft && bRight;
    }

    function updateBoardState() {
        tiles.forEach(t => { if(!t.classList.contains('hidden')) t.classList.toggle('blocked', isBlocked(t)); });
        const remaining = tiles.filter(t => !t.classList.contains('hidden'));
        document.getElementById('count').textContent = remaining.length;
        if(remaining.length === 0) { document.getElementById('msg-text').textContent = "YOU WIN!"; document.getElementById('msg-overlay').style.display = 'flex'; }
    }

    function getHint() {
        tiles.forEach(t => t.classList.remove('hint'));
        const free = tiles.filter(t => !t.classList.contains('hidden') && !isBlocked(t));
        for(let t1 of free) for(let t2 of free) if(t1 !== t2 && t1.dataset.v === t2.dataset.v) {
            t1.classList.add('hint'); t2.classList.add('hint'); return;
        }
    }

    function handleTileClick(t) {
        if(isBlocked(t)) return;
        tiles.forEach(tile => tile.classList.remove('hint'));
        if(!selected) { selected = t; t.classList.add('selected'); }
        else if(selected === t) { selected.classList.remove('selected'); selected = null; }
        else if(selected.dataset.v === t.dataset.v) {
            t.classList.add('hidden'); selected.classList.add('hidden'); selected = null; updateBoardState();
        } else {
            selected.classList.remove('selected'); selected = t; t.classList.add('selected');
        }
    }

    init();
</script>
</body>
</html>
