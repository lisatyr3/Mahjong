<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Mahjong Solitaire</title>
    <style>
        :root {
            --tile-ivory: #fffef0;
            --tile-side: #d1d5db;
            --tile-back: #059669;
            --bg-dark: #022c22;
            --bg-light: #065f46;
        }

        body {
            margin: 0;
            background: radial-gradient(circle, var(--bg-light) 0%, var(--bg-dark) 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            padding: 20px;
            text-align: center;
            z-index: 10;
        }

        .stats {
            background: rgba(0,0,0,0.3);
            padding: 8px 20px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .controls button {
            padding: 10px 25px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            transition: transform 0.1s;
            margin: 0 5px;
        }

        .btn-hint { background: #10b981; color: white; box-shadow: 0 4px 0 #047857; }
        .btn-new { background: #ef4444; color: white; box-shadow: 0 4px 0 #b91c1c; }
        
        button:active { transform: translateY(3px); box-shadow: none; }

        .board-container {
            position: relative;
            width: 1100px;
            height: 800px;
            margin-top: 20px;
            transform-style: preserve-3d;
        }

        .tile {
            position: absolute;
            width: 62px;
            height: 82px;
            background: linear-gradient(135deg, #ffffff 0%, #f3f4f6 100%);
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 
                -1px 1px 0 var(--tile-side),
                -2px 2px 0 var(--tile-side),
                -3px 3px 0 var(--tile-back),
                -4px 4px 0 var(--tile-back),
                -6px 8px 15px rgba(0,0,0,0.4);
        }

        .tile::after {
            content: '';
            position: absolute;
            inset: 3px;
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 3px;
            pointer-events: none;
        }

        .tile.selected {
            background: #fef08a;
            transform: translate(0, -12px);
            box-shadow: 0 0 20px #facc15, -3px 3px 0 var(--tile-back);
            z-index: 200 !important;
        }

        .tile.hint {
            animation: pulse 0.8s infinite alternate;
        }

        @keyframes pulse {
            from { box-shadow: 0 0 5px #fff; }
            to { box-shadow: 0 0 25px #60a5fa; outline: 4px solid #60a5fa; }
        }

        .tile.blocked {
            filter: brightness(0.7) grayscale(0.3);
        }

        .tile.hidden { display: none; }

        .tile svg { width: 80%; height: 80%; pointer-events: none; }

        /* Overlay Message */
        #msg-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #msg-overlay h2 { font-size: 3rem; margin-bottom: 20px; }
    </style>
</head>
<body>

<header>
    <h1>Mahjong Solitaire</h1>
    <div class="stats">Tiles Left: <span id="count">144</span></div>
    <div class="controls">
        <button class="btn-hint" onclick="getHint()">Need a Hint?</button>
        <button class="btn-new" onclick="location.reload()">New Game</button>
    </div>
</header>

<div class="board-container" id="board"></div>

<div id="msg-overlay">
    <h2 id="msg-text">No More Moves!</h2>
    <button class="btn-new" onclick="location.reload()">Try Again</button>
</div>

<script>
    const board = document.getElementById('board');
    const msgOverlay = document.getElementById('msg-overlay');
    let tiles = [];
    let selected = null;

    function createTurtleLayout() {
        const layout = [];
        // Layer 0 (Bottom)
        for(let r=0; r<8; r++) {
            for(let c=0; c<12; c++) {
                if ((r>0 && r<7) || (c>0 && c<11)) layout.push({r, c, z:0});
            }
        }
        // Layer 1
        for(let r=1; r<7; r++) {
            for(let c=2; c<10; c++) layout.push({r, c, z:1});
        }
        // Layer 2
        for(let r=2; r<6; r++) {
            for(let c=4; c<8; c++) layout.push({r, c, z:2});
        }
        // Layer 3 (The Peak)
        layout.push({r:3.5, c:5.5, z:3});
        layout.push({r:3.5, c:6.5, z:3});
        
        return layout.slice(0, 144);
    }

    function getTileSVG(val) {
        const [type, num] = val.split('-');
        const colors = { dots: '#2563eb', bamboo: '#15803d', char: '#dc2626', wind: '#1f2937' };
        const charMap = { 'char': '萬', 'E': '東', 'S': '南', 'W': '西', 'N': '北', 'R': '中', 'G': '發', 'B': '白' };
        
        let content = '';
        if(type === 'dots') {
            content = `<circle cx="50" cy="50" r="35" fill="none" stroke="${colors.dots}" stroke-width="6"/><text x="50" y="62" text-anchor="middle" fill="${colors.dots}" font-weight="bold" font-size="35">${num}</text>`;
        } else if(type === 'bamboo') {
            content = `<rect x="42" y="20" width="16" height="60" rx="4" fill="${colors.bamboo}"/><text x="50" y="58" text-anchor="middle" fill="white" font-size="24" font-weight="bold">${num}</text>`;
        } else {
            const displayChar = charMap[num] || charMap[type] || num;
            content = `<text x="50" y="68" text-anchor="middle" font-size="55" fill="${colors[type] || '#333'}">${displayChar}</text>`;
        }
        return `<svg viewBox="0 0 100 100">${content}</svg>`;
    }

    function init() {
        board.innerHTML = "";
        tiles = [];
        const layout = createTurtleLayout();
        const values = [];

        // Generate 144 tiles
        ['dots','bamboo','char'].forEach(t => { 
            for(let i=1; i<=9; i++) for(let j=0; j<4; j++) values.push(`${t}-${i}`); 
        });
        ['E','S','W','N','R','G'].forEach(v => { 
            for(let j=0; j<4; j++) values.push(`wind-${v}`); 
        });
        while(values.length < 144) values.push('wind-B'); 
        values.sort(() => Math.random() - 0.5);

        layout.forEach((p, i) => {
            const t = document.createElement('div');
            t.className = 'tile';
            t.dataset.v = values[i];
            t.dataset.r = p.r; t.dataset.c = p.c; t.dataset.z = p.z;
            
            // Positioning with centering offset
            const x = (p.c * 68) - (p.z * 6) + 150;
            const y = (p.r * 88) - (p.z * 6) + 50;
            
            t.style.left = `${x}px`;
            t.style.top = `${y}px`;
            t.style.zIndex = p.z;
            
            t.innerHTML = getTileSVG(values[i]);
            t.onclick = () => handleTileClick(t);
            board.appendChild(t);
            tiles.push(t);
        });
        updateBoardState();
    }

    function isTileBlocked(t) {
        const r = parseFloat(t.dataset.r);
        const c = parseFloat(t.dataset.c);
        const z = parseInt(t.dataset.z);
        
        const active = tiles.filter(x => !x.classList.contains('hidden') && x !== t);
        
        // Check if any tile is directly on top
        const onTop = active.some(x => 
            parseInt(x.dataset.z) > z && 
            Math.abs(parseFloat(x.dataset.r) - r) < 1 && 
            Math.abs(parseFloat(x.dataset.c) - c) < 1
        );
        if(onTop) return true;

        // Check Left/Right blockage (Must have both sides blocked to be "trapped")
        const blockedLeft = active.some(x => 
            parseInt(x.dataset.z) === z && 
            Math.abs(parseFloat(x.dataset.r) - r) < 1 && 
            parseFloat(x.dataset.c) === c - 1
        );
        const blockedRight = active.some(x => 
            parseInt(x.dataset.z) === z && 
            Math.abs(parseFloat(x.dataset.r) - r) < 1 && 
            parseFloat(x.dataset.c) === c + 1
        );
        
        return blockedLeft && blockedRight;
    }

    function updateBoardState() {
        let freeTiles = [];
        tiles.forEach(t => {
            if(t.classList.contains('hidden')) return;
            const blocked = isTileBlocked(t);
            t.classList.toggle('blocked', blocked);
            if(!blocked) freeTiles.push(t);
        });

        const remaining = tiles.filter(t => !t.classList.contains('hidden'));
        document.getElementById('count').textContent = remaining.length;

        if (remaining.length === 0) {
            document.getElementById('msg-text').textContent = "Victory!";
            msgOverlay.style.display = 'flex';
            return;
        }

        // Check for No More Moves
        const hasMoves = freeTiles.some(t1 => 
            freeTiles.some(t2 => t1 !== t2 && t1.dataset.v === t2.dataset.v)
        );
        
        if(!hasMoves) {
            msgOverlay.style.display = 'flex';
        }
    }

    function getHint() {
        tiles.forEach(t => t.classList.remove('hint'));
        const free = tiles.filter(t => !t.classList.contains('hidden') && !t.classList.contains('blocked'));
        
        for(let t1 of free) {
            for(let t2 of free) {
                if(t1 !== t2 && t1.dataset.v === t2.dataset.v) {
                    t1.classList.add('hint');
                    t2.classList.add('hint');
                    t1.scrollIntoView({behavior: "smooth", block: "center"});
                    return;
                }
            }
        }
    }

    function handleTileClick(t) {
        if(t.classList.contains('blocked')) return;
        tiles.forEach(tile => tile.classList.remove('hint'));

        if(!selected) {
            selected = t;
            t.classList.add('selected');
        } else if(selected === t) {
            selected.classList.remove('selected');
            selected = null;
        } else if(selected.dataset.v === t.dataset.v) {
            t.classList.add('hidden');
            selected.classList.add('hidden');
            selected = null;
            updateBoardState();
        } else {
            selected.classList.remove('selected');
            selected = t;
            t.classList.add('selected');
        }
    }

    init();
</script>

</body>
</html>
